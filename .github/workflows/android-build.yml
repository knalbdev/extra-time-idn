name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extratime-app/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            extratime-app/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('extratime-app/android/**/*.gradle*', 'extratime-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install web app dependencies
        run: npm ci

      - name: Build static web export
        run: npm run build

      - name: Install Capacitor app dependencies
        working-directory: extratime-app
        run: npm ci

      - name: Sync Capacitor Android platform
        working-directory: extratime-app
        run: npx cap sync android

      - name: Grant execute permission to Gradle wrapper
        working-directory: extratime-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: extratime-app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: extratime-debug-apk
          path: extratime-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
